[package]
name = "reviewglass"
version = "0.1.0"
description = "Desktop companion for AI-assisted coding sessions: magnifier glass, session and quota panel, live diff."
authors = ["Petri Korhonen / Sunrise Software Oy"]
license = "Apache-2.0"
repository = "https://github.com/Sunrisesoftware-app/reviewglass"
edition = "2021"
rust-version = "1.85"
# Two binaries now ship: the app and the statusLine collector. Tauri bundles the one
# named here; the collector is installed beside it.
default-run = "reviewglass"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "reviewglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The collector Claude Code runs as its statusLine command. A binary rather than a
# shell script: on Windows the status line goes through Git Bash when installed and
# PowerShell otherwise, and Git Bash eats unquoted backslashes in Windows paths.
[[bin]]
name = "reviewglass-statusline"
path = "src/bin/statusline.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-capture = "2.0.1"
tauri-plugin-global-shortcut = "2"
parking_lot = "0.12.5"
dirs = "7.0.0"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
